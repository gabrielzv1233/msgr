<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A free messaging app compleate with accounts and special syling for your message">
    <meta name="author" content="Gabrielzv1233">
    <style>
        body {
            margin: 0;
            background-color: #1C2333;
            overflow-y: scroll;
            color: white;   
        }
        .messages {
            margin: 5px;
            color: #F5F9FC;
            word-break: break-all;
        }
        #message {
            width: 98%;
            resize: none;
            overflow-y: hidden;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            border: 1px solid #000;
            background-color: #1C2333;
            color: white;
            font-weight: 700;
        }
        .send {
            border-top: 3px solid black;
            padding-top: 5px;
        }
        input[type="submit"] {
            border-radius: 5px;
        }
        .toggle-scroll-bg {
            border-radius: 5px;
        }
        button {
            border-radius: 5px;
        }
        label {
            color: #F5F9FC;
        }
        .toggle-scroll {
            margin-top: 5px;
            cursor: pointer;
        }
        a {
            color:aqua;
        }
        .code {
            display: inline-block;
            background-color: #1f1f1f;
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom:1px;
            padding-top:1px;
            border: 1px solid white;
        }
        .parent {
            position: relative;
          }
    </style>
    <title>msgr v2</title><meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="messages"></div>
    <center>
        <div class="footer">
            {{adminbutton | safe}}<button style="position: absolute;top: 10px;right: 10px;" onclick="window.open('/account', '_blank');">Open Account</button>
            <div class="send">
                <button class="toggle-scroll-bg"><div class="toggle-scroll" onclick="toggleScroll()" style="padding-bottom:5px;">☑ Enable auto scroll</div></button>
                <form method="POST" action="/send" autocomplete="off" id="send">
                    <div>Username: {{username}}</div>
                    <div class="message-box">
                        <textarea id="message" placeholder="Type your message" rows="1" maxlength="600" required name="message"></textarea>
                      </div>
                    characters left: <b class="char-left"></b>
                    <br><input type="submit" value="send" style="width:100px;">
                </form>
            </div>
        </div>
    </center>
    <script>
window.addEventListener('DOMContentLoaded', function() {
    adjustMessagesPadding();
    var textbox = document.getElementById('message');
    textbox.focus();
});
setInterval(adjustMessagesPadding, 500);
window.addEventListener('resize', adjustMessagesPadding);

function adjustMessagesPadding() {
    const messagesDiv = document.querySelector('.messages');
    const footerDiv = document.querySelector('.footer');
    const footerHeight = footerDiv.offsetHeight;
    const paddingValue = footerHeight + 'px';
    messagesDiv.style.paddingBottom = paddingValue;
}
// Get the message input element and char left element
const messageInput = document.getElementById('message');
const charLeftElement = document.querySelector('.char-left');

// Define the char limit
const charLimit = 600;

// Function to update char left element based on input
function updateCharCount() {
  // Calculate the number of characters remaining
  const messageLength = messageInput.value.length;
  const charsRemaining = charLimit - messageLength;

  // Update the char left element
  charLeftElement.textContent = charsRemaining;

  // Apply color based on the number of characters remaining
  if (charsRemaining > 100) {
    charLeftElement.style.color = 'limegreen';
  } else if (charsRemaining > 50) {
    charLeftElement.style.color = 'yellow';
  } else if (charsRemaining > 25) {
    charLeftElement.style.color = 'orange';
  } else {
    charLeftElement.style.color = 'red';
  }
}

// Initial update on page load

updateCharCount();
messageInput.addEventListener('input', function() {
    adjustTextBoxHeight();
  });
  
  messageInput.addEventListener('focus', function() {
    adjustTextBoxHeight();
  });
  
  messageInput.addEventListener('blur', function() {
    resetTextBoxHeight();
  });
  
  function adjustTextBoxHeight() {
    const lineHeight = parseInt(getComputedStyle(messageInput).lineHeight);
    const maxLines = 5;
    const lines = messageInput.value.split('\n').length;
    const newLines = Math.min(lines, maxLines);
  
    messageInput.rows = newLines;
    messageInput.style.height = lineHeight * newLines + 'px';
  }
  
  function resetTextBoxHeight() {
    messageInput.rows = 1;
    messageInput.style.height = '';
  }

// Event listener for input event on the message input
messageInput.addEventListener('input', updateCharCount);
        const messagesDiv = document.querySelector('.messages');
        let autoScrollEnabled = true;
        let scrolledUp = false;
        let updatingEnabled = true;
        let messageCount = 0;
        
        window.addEventListener('DOMContentLoaded', function() {
            var textbox = document.getElementById('message');
            textbox.focus();
        });
        
        function updateMessages() {
            if (!updatingEnabled) return;
        
            fetch("{{ url_for('static', filename='conversations/' + file) }}")
                .then(function(response) {
                    if (response.ok) {
                        return response.text();
                    } else {
                        throw new Error('Error: ' + response.status);
                    }
                })
                .then(function(html) {
                    const shouldScroll = (messagesDiv.scrollTop + messagesDiv.clientHeight === messagesDiv.scrollHeight);
        
                    messagesDiv.innerHTML = html;
        
                    // Load only the last 20 messages
                    const allMessages = messagesDiv.querySelectorAll('.message');
                    const totalMessages = allMessages.length;
        
                    if (totalMessages > messageCount) {
                        const startIndex = Math.max(totalMessages - 20, 0);
                        const visibleMessages = Array.from(allMessages).slice(startIndex, totalMessages);
                        messagesDiv.innerHTML = '';
                        visibleMessages.forEach(function(message) {
                            messagesDiv.appendChild(message);
                        });
                        messageCount = totalMessages;
                    }
        
                    if (autoScrollEnabled && shouldScroll) {
                        window.scrollTo(0, document.body.scrollHeight);
                    } else if (scrolledUp && shouldScroll) {
                        scrolledUp = false;
                    }
                })
                .catch(function(error) {
                    console.log('Fetch error:', error);
                });
        }
        
        updateMessages();
        setInterval(updateMessages, 1000);
        setInterval(function() {
            var links = document.getElementsByTagName('a');
            for (var i = 0; i < links.length; i++) {
                var link = links[i];
                if (link.id !== 'nt') {
                    link.id = 'nt';
                    link.target = '_blank';
                }
            }
        }, 1000);
        
        messagesDiv.addEventListener('scroll', function() {
            const isAtBottom = messagesDiv.scrollTop + messagesDiv.clientHeight === messagesDiv.scrollHeight;
        
            if (!isAtBottom) {
                scrolledUp = true;
            }
        
            // Load more messages when scrolled to the last 10
            if (isAtBottom && messagesDiv.scrollTop > messagesDiv.scrollHeight - messagesDiv.clientHeight - 10) {
                updateMessages();
            }
        });
        
        function toggleScroll() {
            autoScrollEnabled = !autoScrollEnabled;
            const toggleButton = document.querySelector('.toggle-scroll');
            toggleButton.textContent = autoScrollEnabled ? '☑ Enable auto scroll' : '☐ Enable auto scroll';
        }
        
        document.addEventListener('mouseup', function() {
            const selectedText = window.getSelection().toString();
            updatingEnabled = (selectedText === '');
        });
        
        const form = document.getElementById('send'); // Replace 'your-form-id' with the actual ID of your form

        messageInput.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            form.submit();
          }
        });
    </script>
</body>
</html>
